services:
  news-site:
    container_name: news-site
    build: .
    command: sh -c ""
    env_file:
      - .env
    volumes:
      - ./app:/app:Z
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    
  reverse-proxy:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:Z
    ports:
      - "8080:80"
    depends_on:
      - news-site