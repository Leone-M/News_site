services:
  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - my_network
    
  # reverse-proxy:
  #   image: nginx:1.23.0-alpine
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #   - news-site
  #   networks:
  #     - my_network
  #   restart: always

  news-site:
    container_name: news-site
    # image: node:21-alpine
    build: .
    restart: always
    # working_dir: /app
    env_file:
      - .env
    volumes:
      - ./app:/app/app:Z
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
    networks:
      - my_network
    command: sh -c "npx prisma migrate dev --name init && npx tsx ./prisma/seed.ts && npm run dev"

networks:
  my_network: