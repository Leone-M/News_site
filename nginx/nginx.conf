worker_processes 1;

events { 
    worker_connections 1024;
}

http {
    # upstream newssiteupstream {
    # server news-site:3000 fail_timeout=5s max_fails=5;
    # }

    server {
        listen 80;
        server_name localhost;

        location / {
            # proxy_pass newssiteupstream;
            proxy_pass http://news-site:3000;  # Перенаправление запросов к приложению Next.js
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}